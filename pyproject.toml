[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifti-mrs-plus"
version = "0.1.0"
description = "Efficient, backend-agnostic batching of NIfTI-MRS spectra (NumPy / PyTorch / JAX / TensorFlow / Keras)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Julian P. Merkofer", email = "j.p.merkofer@tue.nl" },
]
keywords = [
    "MRS",
    "spectroscopy",
    "NIfTI-MRS",
    "medical imaging",
    "machine learning",
    "batching",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21.0",
    "nifti-mrs>=0.1.0",
]

[project.optional-dependencies]
# Backend-agnostic op namespace (nifti_mrs_plus.ops). Keras 3 needs a framework
# behind it -- install one of the extras below alongside this one.
ops = ["keras>=3.0.0"]
torch = ["torch>=1.10.0"]
jax = ["jax>=0.4.0", "jaxlib>=0.4.0"]
tensorflow = ["tensorflow>=2.8.0"]
keras = ["keras>=3.0.0"]
viz = ["matplotlib>=3.4.0"]
hdf5 = ["h5py>=3.0.0"]
all = [
    "torch>=1.10.0",
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "tensorflow>=2.8.0",
    "keras>=3.0.0",
    "matplotlib>=3.4.0",
    "h5py>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "matplotlib>=3.4.0",
    "h5py>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/julianmer/NIfTI-MRS-Plus"
Repository = "https://github.com/julianmer/NIfTI-MRS-Plus"
"Bug Tracker" = "https://github.com/julianmer/NIfTI-MRS-Plus/issues"

[tool.setuptools]
packages = ["nifti_mrs_plus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
